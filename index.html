<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Jacky</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 10;
    }

    .heart {
      width: 50px;
      height: 50px;
      background: red;
      position: relative;
      transform: rotate(-45deg);
      margin-bottom: 20px;
      animation: beat 1s infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      width: 50px;
      height: 50px;
      background: red;
      border-radius: 50%;
      position: absolute;
      top: -25px;
      left: 0;
    }

    .heart::after {
      left: 25px;
      top: 0;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1) rotate(-45deg);
      }
      50% {
        transform: scale(1.1) rotate(-45deg);
      }
    }

    .progress-bar {
      width: 80%;
      height: 10px;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #ff6f61;
      transition: width 0.1s linear;
    }

    .card {
      display: none;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
      max-width: 300px;
    }

    .card h1 {
      color: #ff6f61;
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="heart"></div>
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
  </div>
  <div class="card" id="card">
    <h1>Para Jacky 💖</h1>
    <p>
      Querida Jacky, <br>
      Cada día a tu lado es un regalo lleno de amor, alegría y sonrisas. 
      Gracias por iluminar mi vida con tu presencia. 
      Te amo más de lo que las palabras pueden expresar. ❤️
    </p>
  </div>
  <script>
    const progress = document.getElementById('progress');
    const loader = document.getElementById('loader');
    const card = document.getElementById('card');

    let width = 0;

    const interval = setInterval(() => {
      if (width >= 100) {
        clearInterval(interval);
        loader.style.display = 'none';
        card.style.display = 'block';
      } else {
        width += 1;
        progress.style.width = width + '%';
      }
    }, 50);
  </script>
</body>
</html>
